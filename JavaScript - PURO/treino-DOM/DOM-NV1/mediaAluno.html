<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Interagindo com botão prompt</title>
</head>
<body>
    <style>
        .cont{
            width: 600px;
            margin-left: 50px;
            border: 1px solid red;
        }

        .cont h1{
            text-align: center;
            font-size: 45px;
        }

        .cont button{
            padding: 30px 55px; 
            font-size: 30px;
            display: flex;/* essa combinação faz com que o elemento fique centralizado junto a conteiner*/
            margin: 0 auto;/* essa combinação faz com que o elemento fique centralizado junto a conteiner*/
            cursor: pointer;
            border-radius: 20px;
            border: 1px solid transparent;
            background-color: lightblue;
            color: black;
        }

        button:hover{
            background-color: rgb(112, 161, 177);
            color: white;
        }

        .cont p{
            text-align: center;
            font-size: 30px;
            border: 1px solid blue;
            padding: 20px;
        }

    </style>

    <div class="cont">
        <h1>Calculando a média do aluno</h1>
        <button onclick="cliqueMe()">clica notas</button>
        <p>Aqui vai aparecer o resultado</p>

    </div>

    



<script>

    function cliqueMe(){
        let nome = prompt("Nome do aluno:");
        let nota1 = prompt("Digite a primeira nota:");
        let nota2 = prompt("Digite a segunda nota:");


        
        

        document.querySelector(".cont p").innerHTML = `O aluno: ${nome} <br>
        as notas obtidadas foram: ${nota1} e ${nota2} <br>
        tem a média de: ${(parseInt(nota1) + parseInt(nota2)) / 2}`

    }


</script>


</body>
</html>
