<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Barra de Navegação </title>
  </head>
  <body class="bg-gray-300 text-gray-800 font-sans p-4 md:p-8">
      
     <nav class="fixed w-full z-50 top-0 start-0 border-b border-gray-700 bg-gray-900/70 backdrop-blur-md">
        <div class="max-w-screen-xl flex flex-wrap items-center justify-between mx-auto p-4">
           
          <a href="#" class="flex items-center space-x-3">
             <span class="self-center text-2xl font-bold whitespace-nowrap text-white tracking-tighter">
                DEV <span class="text-blue-500">FLOW</span>
             </span>
          </a>

          <div class="flex md:order-2 space-x-3">
            <button type="button"
            class="text-white bg-blue-600 hover:bg-blue-700 focus:ring-2 focus:outline-none focus:ring-blue-800
            font-medium rounded-lg text-sm px-5 py-2.5 text-center transition-all">Começar agora</button>
          
            <!-- menu mobile-->
            <button id="menu-toggle" type="button"
            class="inline-flex items-center p-2 w-10 h-10 justify-center text-sm text-gray-400
             rounded-lg md:hidden hover:bg-gray-800 focus:outline-none focus:ring-2 focus:ring-gray-600">
                <svg class="w-5 h-5" aria-hidden="true" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 17 14">
                        <path stroke="currentColor" stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M1 1h15M1 7h15M1 13h15"/>
                </svg>
            </button>
        </div>

        <div id="navbar-menu" class="items-center justify-between hidden w-full md:w-auto md:flex md:order-1">
          <ul class="flex flex-col p-4 md:p-0 mt-4 font-medium border border-gray-800 rounded-lg md:space-x-8 md:flex-row md:mt-0 md:border-0">
               <li>
                <a href="#" class="block py-2 px-3 text-blue-500 rounded md:p-0" aria-current="page">Home</a>
               </li>

               <li>
                <a href="#" class="block py-2 px-3 text-gray-300 rounded hover:bg-gray-800 md:hover:bg-transparent md:hover:text-blue-500 md:p-0 transition-colors">Projetos</a>
               </li>
               <li>
                <a href="#" class="block py-2 px-3 text-gray-300 rounded hover:bg-gray-800 md:hover:bg-transparent md:hover:text-blue-500 md:p-0 transition-colors">Serviço</a>
               </li>
               <li>
                <a href="#" class="block py-2 px-3 text-gray-300 rounded hover:bg-gray-800 md:hover:bg-transparent md:hover:text-blue-500 md:p-0 transition-colors">Contato</a>
               </li>
          </ul>

          </div>
        </div>
     </nav>

   
    
  </body>
  <script>
    const btn = document.getElementById('menu-toggle');
    const menu = document.getElementById('navbar-menu');

    btn.addEventListener('click',()=>{
        menu.classList.toggle('hidden')
    });
  </script>
</html>
